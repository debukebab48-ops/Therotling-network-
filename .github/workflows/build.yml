name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-enabled: true
          cache-read-only: false

      - name: Check debug keystore exists
        run: test -f app/debug.keystore || (echo "app/debug.keystore hilang, commit dulu file keystore-nya" && exit 1)

      - name: Build APK
        run: gradle assembleDebug --build-cache --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetThrottler-debug
          path: app/build/outputs/apk/debug/app-debug.apk
